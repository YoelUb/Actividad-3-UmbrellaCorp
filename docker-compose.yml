version: '3.8'

services:

  postgres-db:
    image: postgres:15-alpine
    container_name: umbrella_postgres_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - umbrella_postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  umbrella_postgres_data:
